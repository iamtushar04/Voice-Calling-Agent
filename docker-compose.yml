version: "3.9"

services:

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice_agent_backend
    env_file:
      - .env
    ports:
      - "8516:8516"
    volumes:
      - ./backend:/app        # Hot reload in dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8516 --reload
